name: PS4 deals

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps4-deals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RSS feeds (free games, PS Plus, deals)
        run: npx tsx src/index.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Watchlist prices
        run: npx tsx src/watchlist.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Commit state
        run: |
          git config user.name "deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json docs/prices.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
