name: PS4 deals

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps4-deals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: RSS feeds (free games, PS Plus, deals)
        run: npx tsx src/index.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FEEDS: ${{ vars.FEEDS }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          DIGEST: ${{ vars.DIGEST }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: New store promotions
        run: npx tsx src/promos.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Watchlist prices
        run: npx tsx src/watchlist.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MIN_DISCOUNT: ${{ vars.MIN_DISCOUNT }}
          DIGEST: ${{ vars.DIGEST }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Commit state
        run: |
          git config user.name "deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json digest.json watchlist.json docs
          git diff --cached --quiet || (git commit -m "update state" && git push)
