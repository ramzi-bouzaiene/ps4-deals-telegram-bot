name: check-deals

# schedule-registration refresh 2026-10-08 — forces GitHub to re-read cron triggers
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps4-deals-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Fetch, score, record, alert
        run: npx tsx src/check.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEFAULT_REGION: ${{ vars.DEFAULT_REGION }}
          DIGEST: ${{ vars.DIGEST }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Commit state
        run: |
          git config user.name "deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs digest.json config || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update deals state"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
