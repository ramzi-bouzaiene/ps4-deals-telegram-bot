name: RSS feeds & promotions

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps4-deals-rss
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RSS feeds (free games, PS Plus, deals)
        run: npx tsx src/index.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FEEDS: ${{ vars.FEEDS }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          DIGEST: ${{ vars.DIGEST }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: New store promotions
        run: npx tsx src/promos.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Commit state
        run: |
          git config user.name "deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json digest.json docs || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update feed state"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
