name: PS4 deals bot (commands)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps4-deals-bot
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Long-poll a little under 5 minutes so the next cron tick picks up
      # where this one left off. Private repos: change the cron to "*/15"
      # and BOT_POLL_SECONDS to 860 to save Actions minutes.
      - name: Handle Telegram commands
        run: npx tsx src/bot.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_POLL_SECONDS: "260"

      - name: Commit watchlist changes
        run: |
          git config user.name "deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add watchlist.json
          git diff --cached --quiet || (git commit -m "update watchlist" && git push)
