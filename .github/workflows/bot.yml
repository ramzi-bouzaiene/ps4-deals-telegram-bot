name: PS4 deals bot (commands)

# schedule-registration refresh 2026-10-08 — forces GitHub to re-read cron triggers
on:
  schedule:
    - cron: "0-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps4-deals-bot
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Long-poll a little under 5 minutes so the next cron tick picks up
      # where this one left off. Private repos: change the cron to "*/15"
      # and BOT_POLL_SECONDS to 860 to save Actions minutes.
      - name: Handle Telegram commands
        run: npx tsx src/bot.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_POLL_SECONDS: "260"

      - name: Commit wishlist / settings changes
        run: |
          git config user.name "deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data config || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update bot state"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
