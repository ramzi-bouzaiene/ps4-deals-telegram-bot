name: daily-deals

# schedule-registration refresh 2026-10-08 — forces GitHub to re-read cron triggers
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps4-deals-daily
  cancel-in-progress: false

jobs:
  best:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Best deals of the day
        run: npx tsx src/daily.ts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEFAULT_REGION: ${{ vars.DEFAULT_REGION }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
