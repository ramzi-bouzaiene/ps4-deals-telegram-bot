<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 Deal Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#111; --card:#f4f5f7; --muted:#666; --accent:#0070d1; --good:#1a9c4b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --fg:#eceef2; --card:#1c1f28; --muted:#9aa0ad; --accent:#4da3ff; --good:#4cd07d; }
  }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 1rem; }
  h1 { font-size: 1.3rem; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: var(--card); border-radius: 12px; padding: 1rem; }
  .card h2 { font-size: 1rem; margin: 0 0 .5rem; }
  .row { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: .5rem; }
  .now { font-size: 1.4rem; font-weight: 700; }
  .hit { color: var(--good); }
  canvas { max-height: 140px; }
  #updated { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<h1>🎮 PS4 Deal Tracker</h1>
<p id="updated"></p>
<div class="grid" id="grid"></div>
<script>
fetch("prices.json?" + Date.now())
  .then(r => r.json())
  .then(data => {
    const grid = document.getElementById("grid");
    let newest = "";
    const css = getComputedStyle(document.documentElement);
    const accent = css.getPropertyValue("--accent").trim();

    Object.entries(data)
      .sort((a, b) => a[0].localeCompare(b[0]))
      .forEach(([name, s]) => {
        if (!s.history.length) return;
        const cur = s.history.at(-1);
        newest = cur.t > newest ? cur.t : newest;
        const atLow = s.low !== undefined && cur.price <= s.low;

        const card = document.createElement("div");
        card.className = "card";
        const h2 = document.createElement("h2");
        h2.textContent = name;
        const row = document.createElement("div");
        row.className = "row";
        const now = document.createElement("span");
        now.className = "now" + (atLow ? " hit" : "");
        now.textContent = cur.price;
        const low = document.createElement("span");
        low.textContent = "Lowest tracked: " + (s.low ?? "-");
        row.append(now, low);
        const canvas = document.createElement("canvas");
        card.append(h2, row, canvas);
        grid.append(card);

        new Chart(canvas, {
          type: "line",
          data: {
            labels: s.history.map(h => new Date(h.t).toLocaleDateString()),
            datasets: [{ data: s.history.map(h => h.price), borderColor: accent, stepped: true, pointRadius: 2, tension: 0 }],
          },
          options: { plugins: { legend: { display: false } }, scales: { x: { display: false } } },
        });
      });

    document.getElementById("updated").textContent =
      newest ? "Last price change recorded: " + new Date(newest).toLocaleString() : "No data yet.";
  })
  .catch(() => { document.getElementById("updated").textContent = "Couldn't load prices.json yet."; });
</script>
</body>
</html>
